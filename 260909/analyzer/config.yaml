scan_max_mm: 90.0
cam0_scan_min_mm: 30.0
cam0_scan_max_mm: 90.0
cam1_scan_min_mm: 30.0
cam1_scan_max_mm: 90.0
scan_step_mm: 1.0
gs_iterations: 20
serial0: "26259157"
serial1: "26259158"
pair_tolerance_ms: 8.0
max_clock_uncertainty_ms: 3.0
output_dir: captures
calibration_file: null
camera_library: null
slider_debounce_ms: 160
calibration_window_px: 128
calibration_step_px: 256
calibration_search_px: 12
calibration_min_matches: 15
calibration_max_rms_px: 1.0
calibration_max_holdout_px: 1.5
